services:
  backend:
    image: ghcr.io/pranesdev/aegis-backend:latest
    restart: unless-stopped
    environment:
      MONGO_URI: ${MONGO_URI}
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET}
    expose:
      - "4000"   # reachable from the Docker network (Caddy), not the host directly
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  frontend:
    image: ghcr.io/pranesdev/aegis-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Same-origin strategy: the browser talks to its own host on port 80,
      # Caddy proxies /api/* and /socket.io/* to the backend container.
      NEXT_PUBLIC_SOCKET_URL: ${PUBLIC_SOCKET_URL}
    expose:
      - "3000"   # reachable from the Docker network (Caddy), not the host directly
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"   # ready for when you add a real domain (HTTPS auto-cert)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.docker/config.json:/config.json:ro
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "120"
    command: --label-enable --cleanup

volumes:
  caddy_data:
  caddy_config: