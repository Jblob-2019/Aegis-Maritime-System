services:
  backend:
    image: ghcr.io/pranesdev/aegis-backend:latest
    restart: unless-stopped
    # Host networking lets the frontend reach the backend on
    # `localhost:4000` from the same namespace, and lets the host's
    # LAN IP serve dashboards from phones/other devices on the wifi
    # without bridge-net port-translation surprises. Both services bind
    # directly to all host interfaces.
    network_mode: host
    env_file: .env
    environment:
      # MongoDB is not run locally; this points at the external Atlas cluster.
      PORT: 4000
      FRONTEND_URL: http://192.168.29.141:3000
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  frontend:
    image: ghcr.io/pranesdev/aegis-frontend:latest
    restart: unless-stopped
    network_mode: host
    depends_on:
      - backend
    environment:
      # inject-env.sh will auto-detect the host's LAN IP and bake it
      # into /app/dist/env.js. Override with HOST_LAN_IP only if your
      # server has multiple interfaces and the wrong one is picked.
      HOST_LAN_IP: 192.168.29.141
      BACKEND_PORT: 4000
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.docker/config.json:/config.json:ro
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "120"
    command: --label-enable --cleanup
