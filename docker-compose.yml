services:
  backend:
    image: ghcr.io/pranesdev/aegis-backend:latest
    restart: unless-stopped
    environment:
      MONGO_URI: ${MONGO_URI}
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "4000:4000"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  frontend:
    image: ghcr.io/pranesdev/aegis-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Defaults are fine; inject-env.sh will overwrite NEXT_PUBLIC_API_URL
      # with the detected host LAN IP. NEXT_PUBLIC_SOCKET_URL mirrors it.
      NEXT_PUBLIC_SOCKET_URL: ${PUBLIC_SOCKET_URL}
    ports:
      - "3000:3000"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.docker/config.json:/config.json:ro
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "120"
    command: --label-enable --cleanup