services:
  backend:
    image: ghcr.io/pranesdev/aegis-backend:latest
    restart: unless-stopped
    environment:
      MONGO_URI: ${MONGO_URI}
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "4000:4000"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  frontend:
    image: ghcr.io/pranesdev/aegis-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Browser-facing URLs are injected at runtime by inject-env.sh
      # (see apps/dashboard-next/inject-env.sh). No need to bake anything
      # in here — the runtime script figures out the host LAN IP and writes
      # /app/public/env.js so the browser connects correctly.
      NEXT_PUBLIC_SOCKET_URL: ${PUBLIC_SOCKET_URL}
    ports:
      - "3000:3000"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.docker/config.json:/config.json:ro
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "120"
    command: --label-enable --cleanup