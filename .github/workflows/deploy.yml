name: Deploy Docker Images (self-hosted runner)

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend-api/**'
      - 'apps/dashboard-next/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Pull latest code, stop old containers, build new images & restart
    runs-on: self-hosted
    steps:
      # 1️⃣ Pull the latest code from the main branch
      - name: Checkout latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1️⃣b Create the .env file from GitHub Secrets so docker compose has the variables it needs.
      # If a secret is missing, fall back to the existing .env on the server so secrets already
      # stored there are reused.
      - name: Create .env from GitHub Secrets (fallback to existing .env)
        run: |
          if [ ! -f .env ]; then
            echo "Creating .env from secrets"
            cat > .env << EOF
          GH_OWNER=${{ github.repository_owner }}
          MONGO_ROOT_USER=${{ secrets.MONGO_ROOT_USER }}
          MONGO_ROOT_PASSWORD=${{ secrets.MONGO_ROOT_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          PUBLIC_SOCKET_URL=${{ secrets.PUBLIC_SOCKET_URL }}
          EOF
          else
            echo "Using existing .env on the runner"
          fi

      # 2️⃣ Build the new backend image from the freshly-checked-out code
      - name: Build backend image (latest code)
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/aegis-backend:latest \
            ./apps/backend-api

      # 3️⃣ Build the new frontend image from the freshly-checked-out code
      - name: Build frontend image (latest code)
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/aegis-frontend:latest \
            ./apps/dashboard-next

      # 4️⃣ Stop the currently-running backend & frontend containers
      #    (.env, nginx/certs/, mongo-data remain untouched on the host)
      - name: Stop the currently-running backend & frontend
        run: |
          docker compose stop backend frontend

      # 5️⃣ Recreate the containers from the new images – old ones are deleted.
      - name: Recreate backend & frontend with the freshly-built images
        run: |
          docker compose up -d --force-recreate backend frontend