name: Deploy Docker Images (self-hosted runner)

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend-api/**'
      - 'apps/dashboard-next/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  build-backend:
    name: Build backend image
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build backend image (load into local Docker)
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/aegis-backend:latest \
            ./apps/backend-api

  build-frontend:
    name: Build frontend image
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build frontend image (load into local Docker)
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/aegis-frontend:latest \
            ./apps/dashboard-next

  redeploy:
    name: Recreate backend & frontend containers
    runs-on: self-hosted
    needs: [build-backend, build-frontend]
    steps:
      - name: Pull latest images (no-op if local)
        run: docker compose pull || true
      - name: Force-recreate backend & frontend (old containers are deleted)
        run: docker compose up -d --force-recreate backend frontend