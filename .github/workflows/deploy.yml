name: Deploy Docker Images
on:
  push:
    branches: [main]
    paths:
      - 'apps/backend-api/**'
      - 'apps/dashboard-next/**'
      - '.github/workflows/deploy.yml'
jobs:
  build-backend:
    name: Build & push backend image (Node 22 / ESM)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Buildx is required for cache-from / cache-to of type=gha
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend-api
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/aegis-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  build-frontend:
    name: Build & push frontend image (Next.js 16)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/dashboard-next
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/aegis-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false