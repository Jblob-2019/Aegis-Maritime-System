name: Deploy Docker Images (self-hosted runner)

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend-api/**'
      - 'apps/dashboard-next/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Pull latest code, stop old containers, build new images & restart
    runs-on: self-hosted
    steps:
      # 1️⃣ Pull the latest code from the main branch
      - name: Checkout latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1️⃣a Free ports 3000 (frontend) and 4000 (backend) so the new
      # containers can bind cleanly. Kills any process holding either port.
      - name: Free ports 3000 and 4000
        run: |
          for port in 3000 4000; do
            pid=$(ss -ltnp "sport = :$port" 2>/dev/null | grep -oP 'pid=\K[0-9]+' | head -n1)
            if [ -n "$pid" ]; then
              echo "Port $port is held by PID $pid — killing"
              kill -9 "$pid" 2>/dev/null || true
              sleep 1
            else
              echo "Port $port is free"
            fi
          done

      # 1️⃣b Restore .env from persistent location. actions/checkout@v4 wipes
      # the runner workspace on every run, so we recreate a symlink pointing
      # to the persistent secret file outside the workspace.
      - name: Restore .env from persistent location
        run: |
          ln -sf /home/jana/aegis-secrets/.env "$GITHUB_WORKSPACE/.env"
          echo "✅  .env symlinked:"
          ls -la "$GITHUB_WORKSPACE/.env"

      # 2️⃣ Build the new backend image from the freshly-checked-out code
      - name: Build backend image (latest code)
        run: |
          docker build \
            -t ghcr.io/pranesdev/aegis-backend:latest \
            ./apps/backend-api

      # 3️⃣ Build the new frontend image from the freshly-checked-out code
      - name: Build frontend image (latest code)
        run: |
          docker build \
            -t ghcr.io/pranesdev/aegis-frontend:latest \
            ./apps/dashboard-next

      # 4️⃣ Stop and remove the running backend & frontend containers.
      #    `rm -f` deletes them so the host ports are guaranteed free.
      - name: Stop and remove existing backend & frontend containers
        run: |
          cd ${{ github.workspace }}
          docker compose stop backend frontend || true
          docker compose rm -f  backend frontend || true

      # 5️⃣ Recreate the containers from the freshly-built images.
      - name: Deploy new backend & frontend
        run: |
          cd ${{ github.workspace }}
          docker compose up -d --force-recreate backend frontend