name: Deploy Docker Images (self-hosted runner)

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend-api/**'
      - 'apps/dashboard-next/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Pull latest code, stop old containers, build new images & restart
    runs-on: self-hosted
    steps:
      # 1️⃣ Pull the latest code from the main branch
      - name: Checkout latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1️⃣b Re-create the .env symlink. actions/checkout@v4 wipes the runner
      # workspace on every run, so we recreate a symlink pointing to the
      # persistent secret file outside the workspace. docker compose reads
      # the symlink transparently, so the same .env (with MONGO_URI, JWT_SECRET,
      # PUBLIC_SOCKET_URL, etc.) is reused on every deploy.
      - name: Restore .env from persistent location
        run: |
          ln -sf /home/jana/aegis-secrets/.env "$GITHUB_WORKSPACE/.env"
          echo "✅  .env symlinked:"
          ls -la "$GITHUB_WORKSPACE/.env"

      # 2️⃣ Build the new backend image from the freshly-checked-out code
      - name: Build backend image (latest code)
        run: |
          docker build \
            -t ghcr.io/pranesdev/aegis-backend:latest \
            ./apps/backend-api

      # 3️⃣ Build the new frontend image from the freshly-checked-out code
      - name: Build frontend image (latest code)
        run: |
          docker build \
            -t ghcr.io/pranesdev/aegis-frontend:latest \
            ./apps/dashboard-next

      # 4️⃣ Stop the running backend & frontend containers and free their ports.
      #    --remove-orphans ensures any stray containers from previous runs are
      #    cleaned up, and `|| true` keeps the step idempotent.
      - name: Stop and remove existing backend & frontend containers
        run: |
          cd ${{ github.workspace }}
          docker compose stop backend frontend || true
          docker compose rm -f backend frontend || true

      # 5️⃣ Recreate the containers from the freshly-built images.
      #    --force-recreate is redundant after rm, but keeps the step safe even
      #    if the previous step somehow missed a container.
      - name: Deploy new backend & frontend
        run: |
          cd ${{ github.workspace }}
          docker compose up -d --force-recreate backend frontend