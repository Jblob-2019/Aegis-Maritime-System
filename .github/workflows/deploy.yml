name: Deploy Docker Images (self-hosted runner)

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend-api/**'
      - 'apps/dashboard-next/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Pull latest code, stop old containers, build new images & restart
    runs-on: self-hosted
    steps:
      # 1️⃣ Pull the latest code from the main branch
      - name: Checkout latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1️⃣a Free ports 3000 (frontend) and 4000 (backend) so the new
      # containers can bind cleanly. Prefer stopping the Docker container
      # that publishes the port (safer than killing arbitrary processes).
      - name: Free ports 3000 and 4000
        run: |
          for port in 3000 4000; do
            # 1) If a Docker container publishes this port, stop it.
            container=$(docker ps --format '{{.ID}} {{.Ports}}' \
                        | awk -v p=":$port" '$0 ~ p {print $1; exit}')
            if [ -n "$container" ]; then
              echo "Port $port is published by container $container — stopping"
              docker stop "$container" 2>/dev/null || true
              docker rm -f "$container" 2>/dev/null || true
              sleep 1
            fi

            # 2) Fallback: anything still bound via ss.
            pid=$(ss -ltnp "sport = :$port" 2>/dev/null | grep -oP 'pid=\K[0-9]+' | head -n1)
            if [ -n "$pid" ]; then
              echo "Port $port is held by PID $pid (ss) — killing"
              kill -9 "$pid" 2>/dev/null || true
              sleep 1
            fi

            # 3) Fallback: lsof, if installed.
            if command -v lsof >/dev/null 2>&1; then
              pid=$(lsof -ti tcp:$port 2>/dev/null | head -n1)
              if [ -n "$pid" ]; then
                echo "Port $port is held by PID $pid (lsof) — killing"
                kill -9 "$pid" 2>/dev/null || true
                sleep 1
              fi
            fi

            echo "Port $port is now free"
          done

      # 1️⃣b Copy .env into the workspace as a regular file (not a symlink).
      #     Docker bind-mounting a symlink to an external path can confuse
      #     runc and produce "error mounting ..." failures. cp -a keeps the
      #     file inside the workspace so the bind is unambiguous.
      - name: Restore .env into workspace (regular file)
        run: |
          if [ ! -f /home/jana/aegis-secrets/.env ]; then
            echo "❌  /home/jana/aegis-secrets/.env is missing"
            exit 1
          fi
          cp -a /home/jana/aegis-secrets/.env "$GITHUB_WORKSPACE/.env"
          chmod 644 "$GITHUB_WORKSPACE/.env"
          echo "✅  .env copied into workspace:"
          ls -la "$GITHUB_WORKSPACE/.env"

      # 2️⃣ Build the new backend image
      - name: Build backend image (latest code)
        run: |
          docker build \
            -t ghcr.io/pranesdev/aegis-backend:latest \
            ./apps/backend-api

      # 3️⃣ Build the new frontend image
      - name: Build frontend image (latest code)
        run: |
          docker build \
            -t ghcr.io/pranesdev/aegis-frontend:latest \
            ./apps/dashboard-next

      # 4️⃣ Stop & remove the old backend & frontend containers.
      - name: Stop and remove existing backend & frontend containers
        run: |
          cd ${{ github.workspace }}
          docker compose stop backend frontend || true
          docker compose rm -f  backend frontend || true

      # 5️⃣ Pre-pull external base images with retry.
      - name: Pre-pull watchtower with retry
        run: |
          for img in containrrr/watchtower; do
            for attempt in {1..4}; do
              echo "Pulling $img (attempt $attempt/4)…"
              if docker pull "$img"; then
                echo "✅  $img pulled"
                break
              fi
              echo "❌  Pull failed, retrying in 10s…"
              sleep 10
            done
          done

      # 6️⃣ Bring the entire stack up — with diagnostics if compose fails.
      - name: Start up the full stack
        run: |
          cd ${{ github.workspace }}
          for attempt in {1..3}; do
            echo "docker compose up attempt $attempt/3…"
            if docker compose up -d backend frontend watchtower; then
              echo "✅  Stack is up"
              exit 0
            fi
            echo "❌  Compose up failed, collecting diagnostics…"
            docker compose ps --all || true
            docker compose logs --tail 200 --no-color || true
            echo "Retrying in 10s…"
            sleep 10
          done
          echo "❌  Stack failed to come up after 3 attempts"
          exit 1

      # 7️⃣ Verify the wiring end-to-end.
      - name: Verify frontend-backend wiring
        run: |
          set +e
          echo "── waiting for backend to be healthy ──"
          for i in {1..15}; do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/health || true)
            if [ "$code" = "200" ]; then
              echo "✅  Backend /health returned 200"
              curl -s http://localhost:4000/health
              echo
              break
            fi
            echo "…attempt $i (got: $code)"
            sleep 2
          done

          echo
          echo "── frontend detected host LAN IP ──"
          docker exec $(docker ps -q -f "ancestor=ghcr.io/pranesdev/aegis-frontend:latest") cat /app/dist/env.js 2>/dev/null || echo "(no env.js yet)"

          echo
          echo "── /api/location/latest via direct backend ──"
          curl -s http://localhost:4000/api/location/latest | head -c 400
          echo

          echo
          echo "── /api/alerts via direct backend ──"
          curl -s http://localhost:4000/api/alerts | head -c 400
          echo